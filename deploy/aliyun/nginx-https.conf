server {
    listen 80 default_server;
    server_name _;

    # Preserve the temporary IP entry point until ICP filing and DNS cutover finish.
    client_max_body_size 250m;
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name yryhx.cn www.yryhx.cn;

    location / {
        return 301 https://yryhx.cn$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name yryhx.cn;

    ssl_certificate /etc/nginx/certs/yryhx.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/yryhx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 250m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json image/svg+xml text/css text/javascript;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        access_log off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.yryhx.cn;

    ssl_certificate /etc/nginx/certs/www.yryhx.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.yryhx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://yryhx.cn$request_uri;
}
