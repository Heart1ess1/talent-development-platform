services:
  db:
    image: public.ecr.aws/docker/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: talent_platform
      MYSQL_USER: talent
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - /data/talent-platform/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend

  app:
    image: talent-platform-runtime:17-office
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/talent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: talent
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: 120
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      DEMO_USERS_ENABLED: "false"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      LOCAL_STORAGE_ROOT: /data/uploads
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_PUBLIC_ENDPOINT: ${OSS_PUBLIC_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET:-}
      OSS_PUBLIC_BUCKET: ${OSS_PUBLIC_BUCKET:-}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_RAM_ROLE: ${OSS_RAM_ROLE:-}
      PREVIEW_CACHE_ROOT: /data/preview-cache
      PREVIEW_OFFICE_COMMAND: /usr/bin/libreoffice
      CORS_ORIGINS: ${CORS_ORIGINS}
      FILE_MAX_SIZE: 50MB
      FILE_MAX_REQUEST_SIZE: 250MB
    volumes:
      - ./talent-platform.jar:/app/talent-platform.jar:ro
      - /data/talent-platform/uploads:/data/uploads
      - /data/talent-platform/preview-cache:/data/preview-cache
    tmpfs:
      - /tmp:size=268435456,mode=1777
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    image: public.ecr.aws/docker/library/nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge
